<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prancheta Futsal Digital</title>
<meta name="description" content="Prancheta tática de futsal para iPad: desenhe com a Apple Pencil, apague com um toque e trave a jogada.">
<meta name="theme-color" content="#161618">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prancheta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: Desfazer numa ponta, Apagar na outra, traços e cores no meio; quadra ocupa o resto da tela. Visual único escuro, de beira de quadra. */
:root{
  --app:#0E0E10;
  --bar:#161618;
  --raise:#222226;
  --rule:#3A3A40;
  --text:#EEF3F9;
  --muted:#B4B4BC;
  --accent:#E31B23;
  --accent-ink:#FFFFFF;
  --danger:#E5484D;
  --danger-deep:#6E1A20;
  --court:#0B0B0C;
  --area:#0B0B0C;
  --margin:#232326;
  --line:#FFFFFF;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--app);color:var(--text);font-family:var(--body);
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
.app{height:100%;display:flex;flex-direction:column}
.bar{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bar);border-bottom:1px solid var(--rule);
}
.center{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 14px;min-width:0}
.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{
  min-height:44px;min-width:44px;padding:0 14px;border-radius:10px;
  border:1px solid var(--rule);background:var(--raise);color:var(--text);
  font:700 17px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  touch-action:manipulation;cursor:pointer;position:relative;overflow:hidden;
}
.btn svg{width:20px;height:20px;flex:none}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.big{min-height:64px;padding:0 28px;border-radius:14px;font-size:24px;gap:10px}
.big svg{width:28px;height:28px}
.erase{background:var(--danger-deep);border-color:var(--danger)}
.seg{display:flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.seg .btn{border:0;border-radius:0}
.seg .btn + .btn{border-left:1px solid var(--rule)}
.swatch{
  width:44px;height:44px;border-radius:50%;border:2px solid var(--rule);
  background:var(--raise);display:grid;place-items:center;padding:0;cursor:pointer;touch-action:manipulation;
}
.swatch span{width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.btn:focus-visible,.swatch:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.locked .needs-unlock{opacity:.4}

.stage{flex:1 1 auto;min-height:0;position:relative}
.fit{position:absolute;inset:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px))}
.board{
  position:relative;touch-action:none;border-radius:10px;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.45);background:var(--margin);
}
.locked .board{box-shadow:0 0 0 3px var(--danger),0 10px 30px rgba(0,0,0,.45)}
.court,.ink{position:absolute;inset:0}
.court svg{display:block;width:100%;height:100%}
.crest{position:absolute;pointer-events:none;object-fit:contain;-webkit-user-drag:none}
.ink{width:100%;height:100%}
.mg{fill:var(--margin)}
.cf{fill:var(--court)}
.af{fill:var(--area)}
.ln{fill:none;stroke:var(--line);stroke-width:.12}
.dot{fill:var(--line)}
.net{stroke:var(--line);stroke-width:.03;opacity:.6}
.tx{fill:var(--line);font-family:var(--display);font-weight:800;text-anchor:middle}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;
  transform:translate(-50%,8px);opacity:0;pointer-events:none;
  max-width:calc(100% - 32px);padding:12px 18px;border-radius:12px;
  background:var(--raise);border:1px solid var(--rule);color:var(--text);
  font:600 16px/1.3 var(--body);box-shadow:0 8px 24px rgba(0,0,0,.5);
  transition:opacity .18s ease,transform .18s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:700px){
  .big{min-height:52px;padding:0 14px;font-size:19px}
  .big .txt{display:none}
  .seg .btn .txt{display:none}
}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar" role="toolbar" aria-label="Ferramentas da prancheta">
    <button class="btn big needs-unlock" id="undo" type="button" aria-label="Desfazer o último traço">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span class="txt">Desfazer</span>
    </button>

    <div class="center">
      <div class="seg needs-unlock" role="group" aria-label="Tipo de traço">
        <button class="btn" type="button" aria-pressed="true" data-style="linha" aria-label="Linha livre">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 17c4-8 7 4 11-3s4-6 7-7"/></svg><span class="txt">Linha</span>
        </button>
        <button class="btn" type="button" aria-pressed="false" data-style="seta" aria-label="Movimento com seta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18 18 6"/><path d="M10 6h8v8"/></svg><span class="txt">Seta</span>
        </button>
        <button class="btn" type="button" aria-pressed="false" data-style="passe" aria-label="Passe tracejado">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l2-2M9 13l2-2M14 8l1.5-1.5"/><path d="M11 5h7v7"/></svg><span class="txt">Passe</span>
        </button>
      </div>
      <div class="group needs-unlock" role="group" aria-label="Cor da caneta">
        <button class="swatch" type="button" data-color="branco" aria-pressed="true" aria-label="Caneta branca" style="--c:#FFFFFF"><span></span></button>
        <button class="swatch" type="button" data-color="vermelho" aria-pressed="false" aria-label="Caneta vermelha" style="--c:#FF3B3B"><span></span></button>
      </div>
    </div>

    <button class="btn big erase needs-unlock" id="clear" type="button" aria-label="Apagar todos os desenhos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4-4L14 6l7 7-8 8Z"/><path d="M7 21h14"/><path d="m10 10 7 7"/></svg><span class="txt">Apagar</span>
    </button>
  </div>

  <div class="stage" id="stage">
    <div class="fit" id="fit">
      <div class="board" id="board">
        <div class="court" id="court"></div>
        <img class="crest" id="crest" alt="" aria-hidden="true" draggable="false">
        <canvas class="ink" id="ink" role="img" aria-label="Quadra de futsal para desenhar jogadas com a caneta ou o dedo"></canvas>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  var app=document.getElementById('app');

  var portrait=false, kx=10, ky=10, kr=10, W=0, H=0, Lb=0, Sb=0, dpr=1;
  var PAD_END=36, PAD_SIDE=30; // espaço para gols e textos fora da quadra
  var color='branco', style='linha', locked=false, penSeen=false;
  var undoStack=[], drawing=null;

  function store(key,val){ try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){} }
  function load(key){ try{ var v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }

  var strokes=load(KEY_CUR);
  if(!Array.isArray(strokes)) strokes=[];
  function saveInk(){ store(KEY_CUR,strokes); }
  function pushUndo(){ undoStack.push(JSON.stringify(strokes)); if(undoStack.length>60) undoStack.shift(); }

  /* ---------- coordenadas ----------
     A quadra estica para ocupar a tela inteira (como numa prancheta física).
     Comprimento usa kx, largura usa ky; círculos e áreas usam kr para continuarem redondos. */
  function FX(x){ return PAD_END+x*kx; }
  function FY(y){ return PAD_SIDE+y*ky; }
  function toScreen(x,y){ var fx=FX(x), fy=FY(y); return portrait ? [Sb-fy, fx] : [fx, fy]; }
  function toCourt(sx,sy){ var fx,fy; if(portrait){ fx=sy; fy=Sb-sx; } else { fx=sx; fy=sy; } return [(fx-PAD_END)/kx, (fy-PAD_SIDE)/ky]; }

  /* ---------- quadra ---------- */
  function n(v){ return Math.round(v*100)/100; }
  function courtSVG(){
    var vb=portrait?('0 0 '+Sb+' '+Lb):('0 0 '+Lb+' '+Sb);
    var tf=portrait?('matrix(0 1 -1 0 '+Sb+' 0)'):'translate(0 0)';
    var x0=FX(0), x40=FX(40), xm=FX(20), y0=FY(0), y20=FY(20), ym=FY(10);
    var r6=6*kr, r3=3*kr, rc=Math.max(5,0.25*kr), post=1.58*ky, gd=Math.max(16,1*kr), mk=Math.max(8,0.4*kr);
    var lw=Math.max(2,0.11*kr);
    function area(left){
      var gx=left?x0:x40, dir=left?1:-1, sw=left?1:0;
      return 'M'+n(gx)+' '+n(ym-post-r6)+' A'+n(r6)+' '+n(r6)+' 0 0 '+sw+' '+n(gx+dir*r6)+' '+n(ym-post)+
             ' L'+n(gx+dir*r6)+' '+n(ym+post)+' A'+n(r6)+' '+n(r6)+' 0 0 '+sw+' '+n(gx)+' '+n(ym+post+r6);
    }
    function ln(a,b,c,d,w){ return '<line x1="'+n(a)+'" y1="'+n(b)+'" x2="'+n(c)+'" y2="'+n(d)+'"'+(w?' style="stroke-width:'+n(w)+'"':'')+'/>'; }
    var futsalSize=Math.max(13,Math.min(22,PAD_SIDE*0.62)), zoneSize=Math.max(9,Math.min(12,PAD_SIDE*0.36));
    var out='<svg viewBox="'+vb+'" aria-hidden="true" focusable="false">'+
      '<g transform="'+tf+'">'+
        '<rect class="cf" x="'+n(x0)+'" y="'+n(y0)+'" width="'+n(x40-x0)+'" height="'+n(y20-y0)+'"/>'+
        '<g class="ln" style="stroke-width:'+n(lw)+'">'+
          '<rect x="'+n(x0)+'" y="'+n(y0)+'" width="'+n(x40-x0)+'" height="'+n(y20-y0)+'"/>'+
          ln(xm,y0,xm,y20)+
          '<circle cx="'+n(xm)+'" cy="'+n(ym)+'" r="'+n(r3)+'"/>'+
          '<path d="'+area(true)+'"/><path d="'+area(false)+'"/>'+
          '<path d="M'+n(x0)+' '+n(y0+rc)+' A'+n(rc)+' '+n(rc)+' 0 0 0 '+n(x0+rc)+' '+n(y0)+'"/>'+
          '<path d="M'+n(x0)+' '+n(y20-rc)+' A'+n(rc)+' '+n(rc)+' 0 0 1 '+n(x0+rc)+' '+n(y20)+'"/>'+
          '<path d="M'+n(x40)+' '+n(y0+rc)+' A'+n(rc)+' '+n(rc)+' 0 0 1 '+n(x40-rc)+' '+n(y0)+'"/>'+
          '<path d="M'+n(x40)+' '+n(y20-rc)+' A'+n(rc)+' '+n(rc)+' 0 0 0 '+n(x40-rc)+' '+n(y20)+'"/>'+
          ln(x0,FY(5.25),x0-mk,FY(5.25))+ln(x0,FY(14.75),x0-mk,FY(14.75))+
          ln(x40,FY(5.25),x40+mk,FY(5.25))+ln(x40,FY(14.75),x40+mk,FY(14.75))+
          ln(FX(10),y20-mk,FX(10),y20+mk)+ln(FX(15),y20-mk,FX(15),y20+mk)+
          ln(FX(25),y20-mk,FX(25),y20+mk)+ln(FX(30),y20-mk,FX(30),y20+mk)+
          ln(FX(10),ym-mk,FX(10),ym+mk,lw*1.2)+ln(FX(30),ym-mk,FX(30),ym+mk,lw*1.2)+
          '<rect x="'+n(x0-gd)+'" y="'+n(ym-post)+'" width="'+n(gd)+'" height="'+n(post*2)+'"/>'+
          '<rect x="'+n(x40)+'" y="'+n(ym-post)+'" width="'+n(gd)+'" height="'+n(post*2)+'"/>'+
        '</g>'+
        '<g class="net" style="stroke-width:1">'+
          ln(x0-gd/2,ym-post,x0-gd/2,ym+post)+ln(x0-gd,ym-post/2,x0,ym-post/2)+ln(x0-gd,ym,x0,ym)+ln(x0-gd,ym+post/2,x0,ym+post/2)+
          ln(x40+gd/2,ym-post,x40+gd/2,ym+post)+ln(x40,ym-post/2,x40+gd,ym-post/2)+ln(x40,ym,x40+gd,ym)+ln(x40,ym+post/2,x40+gd,ym+post/2)+
        '</g>'+
        '<circle class="dot" cx="'+n(xm)+'" cy="'+n(ym)+'" r="'+n(Math.max(3,0.2*kr))+'"/>'+
        '<circle class="dot" cx="'+n(x0+r6)+'" cy="'+n(ym)+'" r="'+n(Math.max(3,0.2*kr))+'"/>'+
        '<circle class="dot" cx="'+n(x40-r6)+'" cy="'+n(ym)+'" r="'+n(Math.max(3,0.2*kr))+'"/>'+
        '<text class="tx" x="'+n(xm)+'" y="'+n(y0-PAD_SIDE/2+futsalSize*0.36)+'" font-size="'+n(futsalSize)+'" letter-spacing="'+n(futsalSize*0.3)+'">FUTSAL</text>'+
        '<text class="tx" x="'+n(FX(12.5))+'" y="'+n(y20+PAD_SIDE/2+zoneSize*0.6)+'" font-size="'+n(zoneSize)+'" letter-spacing="1">ZONA DE SUBSTITUIÇÃO</text>'+
        '<text class="tx" x="'+n(FX(27.5))+'" y="'+n(y20+PAD_SIDE/2+zoneSize*0.6)+'" font-size="'+n(zoneSize)+'" letter-spacing="1">ZONA DE SUBSTITUIÇÃO</text>'+
      '</g></svg>';
    return out;
  }

  /* ---------- tinta ---------- */
  function pointBack(pts,dist){
    var acc=0;
    for(var i=pts.length-1;i>0;i--){
      var dx=pts[i][0]-pts[i-1][0], dy=pts[i][1]-pts[i-1][1];
      acc+=Math.sqrt(dx*dx+dy*dy);
      if(acc>=dist) return pts[i-1];
    }
    return pts[0];
  }
  function drawStroke(c,s){
    if(!s.pts || s.pts.length<2) return;
    var pts=s.pts.map(function(p){ return toScreen(p[0],p[1]); });
    var lw=Math.max(3,0.22*kr), col=COLORS[s.color]||'#FFFFFF';
    c.save();
    c.strokeStyle=col; c.fillStyle=col; c.lineWidth=lw; c.lineCap='round'; c.lineJoin='round';
    c.setLineDash(s.style==='passe'?[lw*2.4,lw*2.2]:[]);
    c.beginPath(); c.moveTo(pts[0][0],pts[0][1]);
    for(var i=1;i<pts.length-1;i++){
      var mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2;
      c.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);
    }
    var end=pts[pts.length-1];
    c.lineTo(end[0],end[1]); c.stroke();
    if(s.style!=='linha'){
      var hl=Math.max(14,0.95*kr), back=pointBack(pts,hl*0.9);
      var a=Math.atan2(end[1]-back[1],end[0]-back[0]);
      var bx=end[0]-Math.cos(a)*hl, by=end[1]-Math.sin(a)*hl, w=hl*0.55;
      c.setLineDash([]);
      c.beginPath(); c.moveTo(end[0]+Math.cos(a)*lw*0.4,end[1]+Math.sin(a)*lw*0.4);
      c.lineTo(bx-Math.sin(a)*w,by+Math.cos(a)*w);
      c.lineTo(bx+Math.sin(a)*w,by-Math.cos(a)*w);
      c.closePath(); c.fill();
    }
    c.restore();
  }
  function renderInk(){
    offctx.setTransform(1,0,0,1,0,0); offctx.clearRect(0,0,off.width,off.height);
    offctx.setTransform(dpr,0,0,dpr,0,0);
    strokes.forEach(function(s){ drawStroke(offctx,s); });
    paint();
  }
  function paint(){
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(off,0,0);
    if(drawing){ ctx.setTransform(dpr,0,0,dpr,0,0); drawStroke(ctx,drawing.s); }
  }

  /* ---------- desenhar ---------- */
  function addPoint(e){
    var r=board.getBoundingClientRect(), sx=e.clientX-r.left, sy=e.clientY-r.top;
    var last=drawing.lastS;
    if(last){ var dx=sx-last[0], dy=sy-last[1]; if(dx*dx+dy*dy<2.25) return; }
    drawing.lastS=[sx,sy];
    var c=toCourt(sx,sy);
    drawing.s.pts.push([Math.round(c[0]*100)/100,Math.round(c[1]*100)/100]);
  }
  board.addEventListener('pointerdown',function(e){
    if(e.pointerType==='pen') penSeen=true;
    wake();
    if(locked){ lockedNotice(); return; }
    if(penSeen && e.pointerType==='touch') return; // com a Apple Pencil, a mão apoiada não risca
    if(drawing) return;
    e.preventDefault();
    try{ board.setPointerCapture(e.pointerId); }catch(err){}
    drawing={id:e.pointerId,s:{color:color,style:style,pts:[]},lastS:null};
    addPoint(e); paint();
  });
  board.addEventListener('pointermove',function(e){
    if(!drawing || e.pointerId!==drawing.id) return;
    var evs=(e.getCoalescedEvents && e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
    for(var i=0;i<evs.length;i++) addPoint(evs[i]);
    paint();
  });
  function endStroke(e){
    if(!drawing || e.pointerId!==drawing.id) return;
    var s=drawing.s; drawing=null;
    if(s.pts.length>=2){
      var tot=0;
      for(var i=1;i<s.pts.length;i++){ var dx=s.pts[i][0]-s.pts[i-1][0], dy=s.pts[i][1]-s.pts[i-1][1]; tot+=Math.sqrt(dx*dx+dy*dy); }
      if(tot>=0.3){ pushUndo(); strokes.push(s); saveInk(); renderInk(); return; }
    }
    paint();
  }
  board.addEventListener('pointerup',endStroke);
  board.addEventListener('pointercancel',endStroke);
  board.addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});
  document.addEventListener('gesturestart',function(e){ e.preventDefault(); });

  /* ---------- tamanho e rotação ---------- */
  function layout(){
    var r=fit.getBoundingClientRect();
    if(r.width<40 || r.height<40) return;
    W=Math.floor(r.width); H=Math.floor(r.height);
    portrait = H > W;
    Lb=portrait?H:W; Sb=portrait?W:H;
    PAD_END=Math.max(30,Math.min(44,Lb*0.035));
    PAD_SIDE=Math.max(26,Math.min(38,Sb*0.045));
    kx=(Lb-2*PAD_END)/40; ky=(Sb-2*PAD_SIDE)/20; kr=Math.min(kx,ky);
    board.style.width=W+'px'; board.style.height=H+'px';
    courtEl.innerHTML=courtSVG();
    // escudo como imagem comum, sempre em pé, em qualquer aparelho e posição
    if(!crestEl.src) crestEl.src=CREST;
    var ch=5.4*kr, cw=ch*0.902, c=toScreen(20,10);
    crestEl.style.width=cw+'px'; crestEl.style.height=ch+'px';
    crestEl.style.left=(c[0]-cw/2)+'px'; crestEl.style.top=(c[1]-ch/2)+'px';
    dpr=Math.min(3,window.devicePixelRatio||1);
    cv.width=off.width=Math.round(W*dpr); cv.height=off.height=Math.round(H*dpr);
    renderInk();
  }
  if(window.ResizeObserver){ new ResizeObserver(layout).observe(fit); }
  window.addEventListener('resize',layout);
  window.addEventListener('orientationchange',function(){ setTimeout(layout,150); });

  /* ---------- avisos ---------- */
  var toastTimer=null;
  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toastEl.classList.remove('show'); },2400);
  }
  function lockedNotice(){ toast('Jogada travada. Segure o cadeado para destravar.'); }

  /* ---------- ferramentas ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('[data-style]'),function(b){
    b.addEventListener('click',function(){
      if(locked){ lockedNotice(); return; }
      style=b.dataset.style;
      document.querySelectorAll('[data-style]').forEach(function(x){ x.setAttribute('aria-pressed', String(x===b)); });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-color]'),function(b){
    b.addEventListener('click',function(){
      if(locked){ lockedNotice(); return; }
      color=b.dataset.color;
      document.querySelectorAll('[data-color]').forEach(function(x){ x.setAttribute('aria-pressed', String(x===b)); });
    });
  });
  document.getElementById('undo').addEventListener('click',function(){
    if(locked){ lockedNotice(); return; }
    if(!undoStack.length){ toast('Nada para desfazer.'); return; }
    strokes=JSON.parse(undoStack.pop()); saveInk(); renderInk();
  });
  document.getElementById('clear').addEventListener('click',function(){
    if(locked){ lockedNotice(); return; }
    if(!strokes.length){ toast('A quadra já está limpa.'); return; }
    pushUndo(); strokes=[]; saveInk(); renderInk();
    toast('Quadra apagada. Toque em Desfazer para voltar.');
  });

  /* ---------- tela sempre acesa ---------- */
  var wakeAsked=false;
  function wake(){
    if(wakeAsked || !('wakeLock' in navigator)) return;
    wakeAsked=true;
    navigator.wakeLock.request('screen').catch(function(){});
  }
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible' && wakeAsked && 'wakeLock' in navigator){
      navigator.wakeLock.request('screen').catch(function(){});
    }
  });

  try{ localStorage.removeItem(KEY_LOCK); }catch(e){}
  layout();
})();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }); }
</script>
</body>
